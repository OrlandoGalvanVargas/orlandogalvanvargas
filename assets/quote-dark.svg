<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" fill="none" role="img" aria-label="Personal philosophy"><defs><clipPath id="qc"><rect width="900" height="260" rx="18"/></clipPath><linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E3E7EC" stop-opacity=".95"/><stop offset=".5" stop-color="#7AA2C8" stop-opacity=".9"/><stop offset="1" stop-color="#E3E7EC" stop-opacity=".1"/></linearGradient><linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E131A"/><stop offset="1" stop-color="#121922"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#FFFFFF" stroke-opacity="0.03"/></pattern><radialGradient id="gmask" cx="1" cy="0" r="1.1"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><mask id="gm"><rect width="100%" height="100%" fill="url(#gmask)"/></mask></defs><style>@font-face{font-family:'ID400';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'ID600';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'JB500';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}.in{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}.d1{animation-delay:.05s}.d2{animation-delay:.2s}.d3{animation-delay:.35s}.d4{animation-delay:.5s}.d5{animation-delay:.65s}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.blink{animation:blink 2.4s ease-in-out infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}.orb{transform-box:view-box;transform-origin:820px 40px}.o1{animation:spin 40s linear infinite}.o2{animation:spin 56s linear infinite reverse}.o3{animation:spin 76s linear infinite}.core{transform-box:view-box;transform-origin:820px 40px;animation:pulse 4.5s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.2);opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="899" height="309" rx="18" fill="url(#cbg)" stroke="#252D37"/><rect x="1" y="1" width="898" height="308" rx="18" fill="url(#grid)" mask="url(#gm)"/><g clip-path="url(#qc)" opacity=".55"><g class="orb o3"><ellipse cx="820" cy="40" rx="150.0" ry="46.5" stroke="url(#ring)" stroke-opacity=".55" transform="rotate(-28 820 40)"/><circle cx="952.0" cy="-23.0" r="1.9500000000000002" fill="#E3E7EC" opacity=".8"/></g><g class="orb o2"><ellipse cx="820" cy="40" rx="112.5" ry="37.5" stroke="url(#ring)" stroke-width="1.4" transform="rotate(34 820 40)"/><circle cx="727.0" cy="-21.5" r="2.7" fill="#7AA2C8"/></g><g class="orb o1"><circle cx="820" cy="40" r="75.0" stroke="url(#ring)" stroke-width="1.2" stroke-dasharray="2 9" stroke-linecap="round"/><circle cx="895.0" cy="40" r="2.4000000000000004" fill="#E3E7EC"/></g><g class="orb o2"><ellipse cx="820" cy="40" rx="48.0" ry="15.75" stroke="#7AA2C8" stroke-opacity=".7" transform="rotate(-62 820 40)"/></g><circle cx="820" cy="40" r="19.5" fill="#7AA2C8" opacity=".08"/><circle class="core" cx="820" cy="40" r="6.0" fill="#7AA2C8"/><circle cx="820" cy="40" r="1.9500000000000002" fill="#E3E7EC"/></g><path d="M44 86c0-16 8-27 24-31l3 6c-8 3-12 9-12 15h10v20h-25zm34 0c0-16 8-27 24-31l3 6c-8 3-12 9-12 15h10v20h-25z" fill="#7AA2C8" opacity=".9"/><g class="in d1"><text x="44.00" y="140.00" font-family="'ID600', 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#E6EDF3" letter-spacing="-0.4">Success isn't a destination; it's a path you keep building.</text></g><g class="in d2"><text x="44.00" y="176.00" font-family="'ID400', 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#AFB9C5" letter-spacing="-0.4">Build with patience, grow through resilience —</text></g><g class="in d3"><text x="44.00" y="212.00" font-family="'ID400', 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#A9C7E4" letter-spacing="-0.4">and when the road ends, draw a new one.</text></g><g class="in d5"><rect x="44" y="261" width="24" height="1.5" fill="#7AA2C8"/><text x="80.00" y="266.00" font-family="'JB500', ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="500" fill="#7D8794" letter-spacing="2.4">ORLANDO GALVAN VARGAS</text></g></svg>