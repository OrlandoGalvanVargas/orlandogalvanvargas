name: Contribution animation

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#2C5F8D&color_dots=#EBEDF0,#C6DBEF,#8BB8DE,#4A8BC2,#2C5F8D
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#E3E7EC&color_dots=#161B22,#13324D,#1F5585,#3B82C4,#7AA2C8

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
